<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🛒 Shop for Future Self</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script src="js/components.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: #f2f2ee; font-family: 'Segoe UI', system-ui, sans-serif; }
    #instructions {
      position: fixed; bottom: 20px; right: 20px;
      background: rgba(30, 30, 30, 0.82); border: 1px solid #E5383B;
      border-radius: 12px; padding: 12px 16px; font-size: 12px;
      color: #fff; pointer-events: none; max-width: 230px; z-index: 50;
    }
    #instructions strong { display: block; margin-bottom: 6px; font-size: 13px; color: #FF6B6B; }
    #toast {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(20, 20, 20, 0.88); color: #fff; padding: 8px 18px;
      border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity 0.25s;
      pointer-events: none; z-index: 60;
    }
    a-scene {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"><circle cx="14" cy="14" r="7" fill="%23E5383B" opacity="0.85"/><circle cx="14" cy="14" r="3" fill="white"/></svg>') 14 14, crosshair;
    }
  </style>
</head>
<body>

<div id="toast"></div>
<div id="instructions">
  <strong>🛒 How to Play</strong>
  <u>Desktop</u><br>
  Mouse — Look around (click to lock)<br>
  Click a grocery — Grab it<br>
  Click again — Put it back<br>
  Click the cart — Place it<br>
  <br>
  <u>VR (Quest)</u><br>
  Point the laser · Trigger — Grab / Place<br>
  <br>
  No walking needed — everything is within reach!
</div>

<a-scene
  background="color: #eef0ea"
  fog="type: linear; color: #eef0ea; near: 6; far: 14"
  vr-mode-ui="enabled: true"
  renderer="antialias: true; colorManagement: true">

  <!-- ═══════════ FIXED PLAYER (no locomotion at all) ═══════════ -->
  <a-entity id="player" position="0 0 0.85">
    <a-entity id="head" camera look-controls="pointerLockEnabled: true" position="0 1.6 0">
      <a-entity id="cursor" cursor="fuse: false"
        position="0 0 -1"
        geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.016"
        material="color: #E5383B; shader: flat; opacity: 0.9"
        raycaster="objects: .grocery-item, .cart-zone, .ui-button; far: 6; interval: 30">
      </a-entity>
    </a-entity>

    <!-- VR controllers: laser-controls already raises mouseenter/mouseleave/click
         on trigger, so grocery-item / cart-zone / ui-button work unmodified. -->
    <a-entity id="leftHand" class="vr-hand"
      laser-controls="hand: left"
      raycaster="objects: .grocery-item, .cart-zone, .ui-button; far: 5"
      line="color: #E5383B; opacity: 0.7">
    </a-entity>
    <a-entity id="rightHand" class="vr-hand"
      laser-controls="hand: right"
      raycaster="objects: .grocery-item, .cart-zone, .ui-button; far: 5"
      line="color: #E5383B; opacity: 0.7">
    </a-entity>
  </a-entity>

  <!-- ═══════════ LIGHTING — bright, clean, normal store lighting ═══════════ -->
  <a-light type="ambient" color="#ffffff" intensity="0.85"></a-light>
  <a-light type="directional" color="#ffffff" intensity="0.55" position="1 4 2"></a-light>
  <a-light type="point" color="#ffffff" intensity="0.35" position="0 2.4 -1" distance="6"></a-light>

  <!-- ═══════════ GAME STATION (everything the player interacts with) ═══════════ -->
  <a-entity id="game-station" position="0 0 0">

    <!-- ── Conveyor belt — right in front of the player ─────── -->
    <a-entity id="conveyor" position="0 0 -1.55">
      <!-- belt surface -->
      <a-box position="0 1.0 0" width="2.1" height="0.08" depth="0.5"
        material="color: #232323; roughness: 0.6"></a-box>
      <a-box position="0 1.045 0" width="2.06" height="0.01" depth="0.46"
        material="color: #3a3a3a; roughness: 0.4"></a-box>
      <!-- end rollers -->
      <a-cylinder position="-1.05 1.0 0" radius="0.09" height="0.5" rotation="0 0 90"
        material="color: #c9c9c9; metalness: 0.6; roughness: 0.3"></a-cylinder>
      <a-cylinder position="1.05 1.0 0" radius="0.09" height="0.5" rotation="0 0 90"
        material="color: #c9c9c9; metalness: 0.6; roughness: 0.3"></a-cylinder>
      <!-- slim support legs (no giant table slab) -->
      <a-box position="-0.9 0.5 0" width="0.08" height="1.0" depth="0.4" material="color: #b8b8b8"></a-box>
      <a-box position="0.9 0.5 0" width="0.08" height="1.0" depth="0.4" material="color: #b8b8b8"></a-box>
      <!-- little backdrop sign right behind the belt -->
      <a-box position="0 1.9 -0.3" width="2.2" height="0.9" depth="0.06" material="color: #ffffff"></a-box>
      <a-text value="FUTURE MARKET" align="center" color="#E5383B" width="3.4" position="0 1.9 -0.26"></a-text>
      <!-- grocery instances are appended here at runtime by game.js -->
    </a-entity>

    <!-- ── Shopping cart — right beside the player ───────────── -->
    <a-entity id="cart" position="0.62 0 -0.55">
      <!-- wire-basket look -->
      <a-box position="0 0.15 0" width="0.5" height="0.02" depth="0.36"
        material="color: #d6d6d6; metalness: 0.7; roughness: 0.25"></a-box>
      <a-box position="-0.24 0.34 0" width="0.02" height="0.4" depth="0.36"
        material="color: #cfcfcf; metalness: 0.7; roughness: 0.25"></a-box>
      <a-box position="0.24 0.34 0" width="0.02" height="0.4" depth="0.36"
        material="color: #cfcfcf; metalness: 0.7; roughness: 0.25"></a-box>
      <a-box position="0 0.34 -0.17" width="0.5" height="0.4" depth="0.02"
        material="color: #cfcfcf; metalness: 0.7; roughness: 0.25"></a-box>
      <a-box position="0 0.34 0.17" width="0.5" height="0.4" depth="0.02"
        material="color: #cfcfcf; metalness: 0.7; roughness: 0.25"></a-box>
      <a-box position="0 0.56 0.19" width="0.5" height="0.05" depth="0.03"
        material="color: #E5383B; roughness: 0.5"></a-box>
      <a-cylinder position="-0.18 0.045 -0.14" radius="0.04" height="0.05" rotation="90 0 0" material="color: #333"></a-cylinder>
      <a-cylinder position="0.18 0.045 -0.14" radius="0.04" height="0.05" rotation="90 0 0" material="color: #333"></a-cylinder>
      <a-cylinder position="-0.18 0.045 0.14" radius="0.04" height="0.05" rotation="90 0 0" material="color: #333"></a-cylinder>
      <a-cylinder position="0.18 0.045 0.14" radius="0.04" height="0.05" rotation="90 0 0" material="color: #333"></a-cylinder>

      <!-- glow that pulses on completion -->
      <a-box class="cart-glow" position="0 0.32 0" width="0.55" height="0.5" depth="0.4"
        material="color: #E5383B; opacity: 0.08; transparent: true; shader: flat; side: double"></a-box>

      <!-- drop zone (click/trigger target) -->
      <a-entity class="cart-zone" cart-zone
        geometry="primitive: box; width: 0.55; height: 0.5; depth: 0.4"
        position="0 0.32 0"
        material="opacity: 0.1; transparent: true; color: #E5383B; shader: flat"></a-entity>
    </a-entity>

    <!-- ── UI: Recipe menu ───────────────────────────────────── -->
    <a-entity id="recipe-menu" position="0 1.68 -1.0" visible="true">
      <a-plane width="1.5" height="0.85" material="color: #ffffff; opacity: 0.95; shader: flat; side: double"></a-plane>
      <a-plane width="1.5" height="0.85" position="0 0 -0.005" material="color: #E5383B; opacity: 0.06; shader: flat; side: double"></a-plane>
      <a-text value="What are you shopping for?" align="center" color="#232323"
        width="2.1" position="0 0.3 0.01"></a-text>
      <a-entity id="recipe-menu-buttons" position="0 -0.03 0.01"></a-entity>
    </a-entity>

    <!-- ── UI: Shopping list (hidden until a recipe is chosen) ─ -->
    <a-entity id="shopping-list-panel" position="-1.15 1.5 -1.2" rotation="0 22 0" visible="false">
      <a-plane width="1.15" height="0.95" material="color: #ffffff; opacity: 0.95; shader: flat; side: double"></a-plane>
      <a-text id="list-title" value="" align="center" color="#E5383B"
        width="2.1" position="0 0.38 0.01"></a-text>
      <a-entity id="list-rows" position="0 0.15 0.01"></a-entity>
    </a-entity>

    <!-- ── UI: Completion panel ─────────────────────────────── -->
    <a-entity id="completion-panel" position="0 1.68 -1.0" visible="false">
      <a-plane width="1.6" height="0.95" material="color: #ffffff; opacity: 0.96; shader: flat; side: double"></a-plane>
      <a-text value="You're ready for your future! ✨" align="center" color="#E5383B"
        width="2.0" position="0 0.26 0.01"></a-text>
      <a-text value="Great choices for who you're becoming." align="center" color="#232323"
        width="1.9" position="0 0.09 0.01"></a-text>
      <a-entity class="ui-button" ui-button="action: replay"
        geometry="primitive: plane; width: 0.55; height: 0.22"
        material="color: #E5383B; shader: flat; side: double"
        position="0 -0.2 0.01">
        <a-text value="Shop Again" align="center" color="#ffffff" width="2.1" position="0 0 0.01"></a-text>
      </a-entity>
    </a-entity>

  </a-entity>

  <!-- ═══════════ COMPACT, BRIGHT ENVIRONMENT ═══════════ -->
  <a-entity id="environment">
    <a-plane position="0 0 0" rotation="-90 0 0" width="4.4" height="4.4"
      material="color: #e2e2dc; roughness: 0.8"></a-plane>
    <a-box position="0 1.4 -2.4" width="4.4" height="2.8" depth="0.08"
      material="color: #f7f7f2; roughness: 0.9"></a-box>
    <!-- a couple of small ceiling lights for polish, kept minimal -->
    <a-box position="-0.8 2.75 -1.4" width="0.7" height="0.03" depth="0.7" material="color: #fffdf0; emissive: #fffbe0; emissiveIntensity: 0.5"></a-box>
    <a-box position="0.8 2.75 -1.4" width="0.7" height="0.03" depth="0.7" material="color: #fffdf0; emissive: #fffbe0; emissiveIntensity: 0.5"></a-box>
  </a-entity>

</a-scene>

<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
